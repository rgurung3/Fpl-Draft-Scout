name: Save league snapshot

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save the snapshot
        run: python save_snapshot.py 52607

      - name: Commit it if anything changed
        run: |
          git config user.name "draft-scout-bot"
          git config user.email "draft-scout-bot@users.noreply.github.com"
          git add history
          git diff --cached --quiet || (git commit -m "Save league snapshot" && git push)
