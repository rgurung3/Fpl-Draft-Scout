<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League banter - Draft Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/common.css">
<style>
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 36px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--pitch);
    border-radius: 4px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
  .card.hot { border-left-color: var(--amber); }
  .card.spoon { border-left-color: var(--rival); }
  .card .tag { font-family: var(--display); font-weight: 600; font-size: 1.25rem; }
  .versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .versus .side { min-width: 0; }
  .versus .side:last-child { text-align: right; }
  .versus .team { font-weight: 600; overflow-wrap: anywhere; }
  .versus .who { color: var(--muted); font-size: .85rem; }
  .versus .v { color: var(--muted); font-family: var(--display); font-size: 1.3rem; }
  .card .line { color: var(--muted); font-size: .95rem; }
  .facts { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
  .facts li { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--amber);
    border-radius: 4px; padding: 12px 16px; }
  .sharebar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; color: var(--muted); font-size: .9rem; margin-bottom: 28px; }
  .sharebar input { flex: 1 1 240px; max-width: 360px; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--surface); color: var(--ink); font-size: .9rem; }
  .back { display: inline-block; margin-bottom: 8px; color: var(--pitch); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <a class="back hidden" id="backLink" href="/">← Back to Draft Scout</a>
      <h1>League banter</h1>
      <p class="sub" style="margin:4px 0 0" id="leagueLine">Hot matches, table battles and facts to argue about</p>
    </div>
    <form class="load" id="loadForm">
      <label>League ID
        <input id="leagueId" inputmode="numeric" pattern="[0-9]+" required placeholder="the number in your league's URL">
      </label>
      <button class="btn" id="loadBtn" type="submit">Show banter</button>
    </form>
  </header>

  <div id="error" class="error hidden" role="alert"></div>

  <div id="app" class="hidden">
    <div class="sharebar">
      <span>Share this page:</span>
      <input id="shareLink" readonly aria-label="Link to share">
      <button class="btn ghost" id="copyLink" type="button">Copy link</button>
    </div>
    <div id="empty" class="empty hidden"></div>

    <section id="matchups">
      <h2>This week's match-ups</h2>
      <p class="sub" id="matchSub"></p>
      <div class="cards" id="cards"></div>
    </section>

    <section id="factsSection">
      <h2>Facts to argue about</h2>
      <p class="sub">Worked out from this season's results. Mild teasing only.</p>
      <ul class="facts" id="facts"></ul>
      <button class="btn ghost hidden" id="moreFacts" type="button"></button>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const FACTS_SHOWN = 2;   // facts shown at first; "Show more" reveals the rest
let BANTER = null, showAll = false;

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const place = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));

async function loadLeague(id, from) {
  $("loadBtn").disabled = true; $("loadBtn").textContent = "Loading…";
  $("error").classList.add("hidden");
  try {
    let r;
    try { r = await fetch(`/api/league/${id}/banter`); }
    catch (e) { throw new Error("Can't reach Draft Scout. Check your connection and try again."); }
    let j = null;
    try { j = await r.json(); } catch (e) { /* not JSON, e.g. a crash page */ }
    if (!r.ok || !j) throw new Error(j?.error || "Draft Scout hit an unexpected error. Try again in a moment.");
    BANTER = j;
    history.replaceState(null, "", "?league=" + id);   // the address is now a link anyone in the league can open
    render(id);
  } catch (e) {
    $("error").textContent = e.message; $("error").classList.remove("hidden");
  } finally {
    $("loadBtn").disabled = false; $("loadBtn").textContent = "Show banter";
  }
}

function side(p) {
  return `<div class="side"><div class="team">${esc(p.team)}</div><div class="who">${esc(p.manager)} · ${place(p.position)}, ${p.league_points} pts</div></div>`;
}

function card(cls, title, a, b, line) {
  return `<div class="card ${cls}"><div class="tag">${esc(title)}</div>
    <div class="versus">${side(a)}<span class="v">v</span>${side(b)}</div>
    <div class="line">${esc(line)}</div></div>`;
}

function render(id) {
  $("app").classList.remove("hidden");
  $("leagueLine").textContent = BANTER.league_name;
  $("shareLink").value = location.origin + location.pathname + "?league=" + id;
  const b = BANTER.banter;
  // the server works out all of this (see league_banter in app.py); this just draws it
  $("empty").classList.toggle("hidden", !!b);
  $("matchups").classList.toggle("hidden", !b);
  $("factsSection").classList.toggle("hidden", !b);
  if (!b) {
    $("empty").textContent = "The banter starts once a gameweek has finished. It needs a head-to-head league, because it's built from the match results.";
    return;
  }
  const cards = [];
  if (b.hot_match) {
    const h = b.hot_match;
    cards.push(card("hot", `Hot match of the week (GW${h.gw})`, h.a, h.b, h.line));
  }
  b.battles.forEach(x => cards.push(card(x.title === "Battle for 3rd" ? "" : "spoon", x.title, x.a, x.b, x.line)));
  $("matchSub").textContent = b.hot_match ? `Looking ahead to gameweek ${b.hot_match.gw}.` : "No matches left to play.";
  $("cards").innerHTML = cards.join("") || `<div class="empty">Nothing to show yet.</div>`;
  renderFacts();
}

function renderFacts() {
  const facts = BANTER.banter.facts;
  $("facts").innerHTML = (showAll ? facts : facts.slice(0, FACTS_SHOWN)).map(f => `<li>${esc(f.text)}</li>`).join("")
    || `<li>No facts yet. Give it a few more gameweeks.</li>`;
  $("moreFacts").classList.toggle("hidden", facts.length <= FACTS_SHOWN);
  $("moreFacts").textContent = showAll ? `Show ${FACTS_SHOWN} only` : `Show more (${facts.length - FACTS_SHOWN} more)`;
}

$("loadForm").addEventListener("submit", e => { e.preventDefault(); loadLeague($("leagueId").value.trim()); });
$("moreFacts").addEventListener("click", () => { showAll = !showAll; renderFacts(); });
$("copyLink").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("shareLink").value); }
  catch (e) { $("shareLink").select(); return; }   // no clipboard access: select it so they can copy by hand
  $("copyLink").textContent = "Copied";
  setTimeout(() => { $("copyLink").textContent = "Copy link"; }, 2000);
});

// a shared link looks like /banter?league=12345
const leagueParam = new URLSearchParams(location.search).get("league");
if (/^[0-9]+$/.test(leagueParam || "")) {
  $("leagueId").value = leagueParam;
  loadLeague(leagueParam);
}
try {   // a way back for people who came from their own team page
  const team = localStorage.getItem("teamId");
  if (/^[0-9]+$/.test(team || "")) { $("backLink").href = "/?team=" + team; $("backLink").classList.remove("hidden"); }
} catch (e) { /* no storage: no back link */ }
</script>
</body>
</html>
